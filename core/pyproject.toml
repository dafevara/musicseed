[project]
name = "musicseed-core"
version = "0.1.0"
description = "Core music recommendation logic for MusicSeed (library, enrichment, embeddings, recommender)"
readme = "../README.md"
authors = [
    { name = "Daniel Valencia", email = "dafevara@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pyyaml>=6.0",
    "httpx>=0.25",
    "numpy>=1.24",
    "essentia-tensorflow==2.1b6.dev1389",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicseed"]
