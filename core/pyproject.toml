[project]
name = "musicseed-core"
version = "0.1.0"
description = "Core music recommendation logic for MusicSeed (library, enrichment, embeddings, recommender)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Daniel Valencia", email = "dafevara@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.25",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicseed"]
