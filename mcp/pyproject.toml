[project]
name = "musicseed-mcp"
version = "0.1.0"
description = "MCP server exposing MusicSeed playlist creation and population as agent tools"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Daniel Valencia", email = "dafevara@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "musicseed-core",
    "mcp>=1.0.0",
    "anyio>=4.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "pytest>=8.0",
]

[project.scripts]
musicseed-mcp = "musicseed_mcp.server:main"

[tool.uv.sources]
musicseed-core = { path = "../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicseed_mcp"]
