# MusicSeed configuration example
#
# Copy to one of:
#   ~/.config/musicseed/config.yaml
#   ~/.musicseed.yaml
#   ./config.yaml   (cwd-relative; e.g. cli/config.yaml when run from cli/)
#
# Never commit a real config file. Prefer ${ENV_VAR} for secrets.
# Values support ${ENV} expansion and ~ for home directory.

database:
  # Single local SQLite file; created by `musicseed init-db`. Backup = copy this file.
  path: ~/.local/share/musicseed/musicseed.db

plex:
  url: http://localhost:32400
  # Required for playlist create / populate. Leave empty and sign in with Plex in
  # the web UI (or run `musicseed-cli plex-login`) — MusicSeed writes the token it
  # receives here. An env var placeholder works too.
  token: ${PLEX_TOKEN}
  # Stable Plex client identifier, generated once by the sign-in flow. Leave as is.
  client_identifier: ""
  library: Music
  # Omit to auto-detect (macOS + Linux Plex data dirs). Override if discovery misses.
  db_path: >-
    ~/Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.db
  # A plain http:// connection to a *remote* (non-local) Plex host sends the token
  # in cleartext, so it is refused unless this is set to true. Prefer https:// or a
  # VPN/tunnel. Local and home-LAN http:// keep working without this flag.
  allow_cleartext_remote: false

# Optional. Leave empty (or omit) if you only use ListenBrainz enrichment.
spotify:
  client_id: ${SPOTIFY_CLIENT_ID}
  client_secret: ${SPOTIFY_CLIENT_SECRET}

# Required for ListenBrainz enrichment (the default source), unless Spotify
# credentials are set above. Get a free user token at
# https://listenbrainz.org/settings/ — authenticated requests get higher
# rate limits. Leave empty (or omit) if you only use Spotify enrichment.
listenbrainz:
  token: ${LISTENBRAINZ_TOKEN}

enrichment:
  concurrency: 5
  batch_size: 50

logging:
  level: INFO
  console: false
  console_level: WARNING

recommendation:
  default_limit: 50
  max_tracks_per_artist: 3
  default_weights:
    sonic: 0.30
    popularity: 0.15
    style: 0.10
    genre: 0.15
    era: 0.05
    novelty: 0.10

# Browser protections for the local API. Loopback and private (home-LAN)
# addresses are always allowed; add a home-network DNS name here if you use
# one. ``csrf_secret`` is generated automatically on first use — leave empty.
security:
  allowed_hosts: []
  csrf_secret: ""

# Bounds on expensive work. Raise these deliberately for very large libraries;
# they keep a single request from forcing unbounded memory, CPU, or disk use.
limits:
  max_request_body_bytes: 1048576
  max_seeds: 50
  max_selection_tracks: 500
  max_search_results: 50
  max_recommendations: 200
  max_snapshot_bytes: 21474836480
