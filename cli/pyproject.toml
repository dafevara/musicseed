[project]
name = "musicseed-cli"
version = "0.1.0"
description = "MusicSeed command-line interface for Plex playlist recommendations"
readme = "../README.md"
authors = [
    { name = "Daniel Valencia", email = "dafevara@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "musicseed-core",
]

[project.scripts]
musicseed = "musicseed_cli.app:app"

[tool.uv.sources]
musicseed-core = { path = "../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicseed_cli"]
