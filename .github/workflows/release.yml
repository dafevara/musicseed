name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Next tag
        id: ver
        run: |
          if git describe --exact-match HEAD >/dev/null 2>&1; then
            echo "HEAD already tagged; skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          if [ -z "$prev" ]; then
            tag=v0.1.0
          else
            ver="${prev#v}"
            major="${ver%%.*}"
            rest="${ver#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            tag="v${major}.${minor}.$((patch + 1))"
          fi
          echo "prev=${prev}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Release notes
        if: steps.ver.outputs.skip != 'true'
        run: |
          {
            echo "Unpack the source archive, then:"
            echo ""
            echo "\`\`\`bash"
            echo "./scripts/install.sh"
            echo "musicseed"
            echo "\`\`\`"
            echo ""
            echo "Python 3.12+, uv, and Node/npm are required to install. Runtime is Python only."
            echo ""
            echo "## Changes"
            echo ""
          } > notes.md
          if [ -n "${{ steps.ver.outputs.prev }}" ]; then
            git log --pretty=format:"- %s (%h)" "${{ steps.ver.outputs.prev }}..HEAD" >> notes.md
          else
            git log --pretty=format:"- %s (%h)" >> notes.md
          fi
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          body_path: notes.md
