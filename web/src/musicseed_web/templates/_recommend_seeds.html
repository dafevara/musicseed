<input type="hidden" id="seed-ids" name="seed_ids" value="{{ seed_ids }}">
{% if seeds %}
<ul class="seed-list">
    {% for seed in seeds %}
    <li class="seed-chip">
        <span class="seed-label">
            <strong>{{ seed.artist.name if seed.artist else 'Unknown' }}</strong>
            &mdash; {{ seed.title }}
        </span>
        <button class="seed-remove"
                hx-post="/recommend/seeds"
                hx-vals='{"action": "remove", "track_id": {{ seed.id }}, "seed_ids": "{{ seed_ids }}"}'
                hx-target="#seed-chips"
                hx-swap="innerHTML"
                title="Remove seed"
                aria-label="Remove {{ seed.title }}">&times;</button>
    </li>
    {% endfor %}
</ul>
{% endif %}
