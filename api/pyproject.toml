[project]
name = "musicseed-api"
version = "0.1.0"
description = "MusicSeed REST API for Plex playlist recommendations"
license = "MIT"
authors = [
    { name = "Daniel Valencia", email = "dafevara@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "musicseed-core",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv.sources]
musicseed-core = { path = "../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicseed_api"]
