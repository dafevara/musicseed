# Shared lint configuration for all MusicSeed apps (core, cli, and future api/mcp/web).
# Ruff discovers this by walking up from each app directory.
line-length = 100
target-version = "py311"

[lint]
# D (pydocstyle) is enabled globally but scoped via per-file-ignores below, so
# docstring coverage on the public seams cannot silently decay (MUS-62).
select = ["E", "F", "I", "N", "W", "D"]
# D105: docstrings on magic methods (__str__, __repr__, ...) are noise for this project.
# (D203/D213-style conflicts are already resolved by the google convention below.)
ignore = ["D105"]

[lint.pydocstyle]
convention = "google"

# D is enforced ONLY on the public seams:
#   core/src/musicseed/services/**, core/src/musicseed/recommender/**,
#   api/src/musicseed_api/handlers/**, cli/src/**.
# Everything else (including api routes, all tests, and the rest of core/api)
# is exempt. Paths are relative to this file (the repo root); ruff resolves
# them against the config's project root even when run from an app directory.
[lint.per-file-ignores]
# NOTE: ruff's per-file-ignores globs are NOT separator-literal — `*` matches
# across `/` too — so package-root modules are listed explicitly (a `*.py`
# glob would also swallow the enforced subpackages below).
"**/tests/**" = ["D"]
"core/src/musicseed/__init__.py" = ["D"]
"core/src/musicseed/config.py" = ["D"]
"core/src/musicseed/exceptions.py" = ["D"]
"core/src/musicseed/logging_config.py" = ["D"]
"core/src/musicseed/sonic.py" = ["D"]
"core/src/musicseed/clients/**" = ["D"]
"core/src/musicseed/db/**" = ["D"]
"core/src/musicseed/enrichers/**" = ["D"]
"core/src/musicseed/importers/**" = ["D"]
"api/src/musicseed_api/__init__.py" = ["D"]
"api/src/musicseed_api/app.py" = ["D"]
"api/src/musicseed_api/server.py" = ["D"]
"api/src/musicseed_api/routes/**" = ["D"]
